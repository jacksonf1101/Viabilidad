name: Compilar .exe para Windows

# Se ejecuta automaticamente al subir cambios a la rama principal,
# o manualmente desde la pestaña "Actions" de GitHub ("Run workflow").
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar el .exe con PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onedir `
            --name "ViabilidadResiduos" `
            --icon=icon.ico `
            --collect-all PySide6 `
            --collect-all ortools `
            --collect-all folium `
            main.py

      - name: Subir la carpeta compilada (.exe + dependencias)
        uses: actions/upload-artifact@v4
        with:
          name: ViabilidadResiduos-Windows
          path: dist/ViabilidadResiduos/

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar el instalador (Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Subir el instalador (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ViabilidadResiduos-Instalador
          path: installer_output/ViabilidadResiduos_Setup.exe
